name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pipx run ruff check . && pipx run ruff format --check .
      - run: python mirrorknife.py --help
      - run: python mirrorknife.py init --dns-file /tmp/d.txt --mirrors-file /tmp/m.yaml
